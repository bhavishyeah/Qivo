server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single source-allow-list CSP applied to every response. Kept identical to
    # the policy in apps/web/vercel.json so the SPA is protected the same way on
    # both the Vercel and Docker/nginx deploy paths. nginx does NOT inherit a
    # server-level add_header into any location that sets its own add_header, so
    # the CSP must be repeated in the location blocks below that do.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.cloudinary.com https://accounts.google.com; frame-src https://accounts.google.com; form-action 'self'; upgrade-insecure-requests";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
    }

    # Service worker must not be cached
    location /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
    }

    # Manifest
    location /manifest.webmanifest {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $csp always;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (apply to responses that don't set their own add_header,
    # i.e. the HTML document from the SPA fallback above)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
}
