<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/maskable_icon_x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/maskable_icon_x96.png" />
    <!-- iOS ignores the manifest icons; it uses this (opaque, square) image. -->
    <link rel="apple-touch-icon" href="/icons/maskable_icon_x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build forms for registrations and fees. Take UPI payments, limit seats, and review every response. Made for colleges, teachers, student clubs and event organisers in India."
    />
    <meta name="theme-color" content="#42005f" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qivo" />
    <meta property="og:title" content="Qivo | Forms for colleges, clubs and events in India" />
    <meta
      property="og:description"
      content="Build forms for registrations and fees. Take UPI payments, limit seats, and review every response."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Qivo | Forms for colleges, clubs and events in India" />
    <meta
      name="twitter:description"
      content="Build forms for registrations and fees. Take UPI payments, limit seats, and review every response."
    />
    <title>Qivo | Forms for colleges, clubs and events in India</title>
    <!-- Self-hosted fonts: preload the two used above the fold. crossorigin is required for font preloads. -->
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Sets data-color-scheme before first paint (no flash of the wrong theme).
         External file because the CSP blocks inline scripts. Must stay a plain,
         synchronous script in <head>. -->
    <script src="/color-scheme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
